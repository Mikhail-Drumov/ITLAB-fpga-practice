name: SystemVerilog CMake CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator libgtest-dev

    - name: Static Code Analysis (Lint)
      run: verilator --lint-only -Wall -Wno-fatal src/*.sv

    - name: Configure CMake
      run: cmake -B build

    - name: Build Simulation Model
      run: cmake --build build -j4

    - name: Run GTest Simulation
      run: ./build/testbench

    - name: Upload Waveforms
      # always() гарантирует загрузку артефакта, даже если тесты или сборка упали
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: simulation-waves
        path: "*.vcd"